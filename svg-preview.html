            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;

        .card {
            background: #ffffff;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
        }

        .svg-container {
            width: 120px;
            height: 120px;
            margin: 0 auto 15px auto;
        }

            height: 100%;
